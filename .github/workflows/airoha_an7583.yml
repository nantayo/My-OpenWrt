name: Build PonWrt for airoha_an7583

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/pbs05/ponwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          bash $GITHUB_WORKSPACE/airoha/an7583/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load XG-040G-MF custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv airoha/an7583/4-XG-040G-MF/files airoha/an7583/4-XG-040G-MF/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))

      - name: Compile XG-040G-MF firmware
        working-directory: ./openwrt
        run: |
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "==== 生效的设备配置 ===="
          grep -E 'CONFIG_TARGET_(airoha|ROOTFS|MULTI|PER_DEVICE)|CONFIG_JSON_OVERVIEW' .config || true
          echo "==== 产物目录 ===="
          ls -la bin/targets/airoha/an7583/ || true
          ls bin/targets/airoha/an7583/*sysupgrade.itb > /dev/null 2>&1 || { echo "未生成 sysupgrade.itb，终止"; exit 1; }
          tar -czf 4-XG-040G-MF-an7583.tar.gz -C bin/targets/airoha an7583
          tar -tzvf 4-XG-040G-MF-an7583.tar.gz

      - name: Upload XG-040G-MF firmware to release
        run: |
          tag="OpenWrt_airoha_an7583_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "" 2> /dev/null || true
          gh release upload $tag openwrt/4-XG-040G-MF-an7583.tar.gz --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[] | .tagName | select(test("airoha_an7583"))' | tail -n +3 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
