name: Build Bootloader for mt798x

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/leobenny666/bl-mt798x-dhcpd-bl2
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler qemu-user-static nodejs npm > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 bootloader
          ln -sf /workdir/bootloader $GITHUB_WORKSPACE/bootloader
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Compile the bootloader
        working-directory: ./bootloader
        run: |
          make BOARD=clt_r30b1
          make BOARD=cmcc_rax3000m

      - name: Upload bootloader to release
        run: |
          tag="Bootloader_mt798x_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "" 2> /dev/null || true
          gh release upload $tag bootloader/output/*.bin --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[] | .tagName | select(test("mt798x"))' | tail -n +2 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done