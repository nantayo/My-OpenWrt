name: Build Bootloader for mt798x

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/leobenny666/bl-mt798x-dhcpd-bl2
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler qemu-user-static nodejs npm > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 bootloader
        ln -sf /workdir/bootloader $GITHUB_WORKSPACE/bootloader
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: SSH connect to Actions
      uses: P3TERX/ssh2actions@main
      if: ${{ github.event.inputs.ssh == 'true' }}

    - name: Compile the bootloader
      run: |
        chmod -R 755 bootloader
        cd bootloader
        make BOARD=clt_r30b1
        make BOARD=cmcc_rax3000m

    - name: Upload bootloader to release
      uses: softprops/action-gh-release@master
      with:
        tag_name: Bootloader_mt798x_${{ env.FILE_DATE }}
        files: bootloader/output/*.bin

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@master
      with:
        keep_latest: 1
        delete_tags : true
        delete_tag_pattern : mt798x