name: Build ImmortalWrt-25.12 for x86_64

on:
  workflow_dispatch:
    inputs:
      G7505:
        description: 'Build G7505 firmware'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
      N4505:
        description: 'Build N4505 firmware'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
      i3-5005U:
        description: 'Build i3-5005U firmware'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update > /dev/null
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo -E apt-get -qq autoremove --purge > /dev/null
        sudo -E apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        bash $GITHUB_WORKSPACE/x86/64/diy/diy.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Adjust source code for 7505
      if: ${{ github.event.inputs.G7505 == 'true' }}
      working-directory: ./openwrt
      run: |
        patch -p1 -f < $GITHUB_WORKSPACE/x86/64/2-7505/simplify-i915-firmware.patch
        patch -p1 -f < $GITHUB_WORKSPACE/x86/64/2-7505/simplify-intel-microcode.patch

    - name: Load 7505 custom config
      if: ${{ github.event.inputs.G7505 == 'true' }}
      run: |
        rm -rf openwrt/files openwrt/.config
        mv x86/64/2-7505/files x86/64/2-7505/.config openwrt/

    - name: Download package
      if: ${{ github.event.inputs.G7505 == 'true' }}
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))

    - name: Compile 7505 firmware
      if: ${{ github.event.inputs.G7505 == 'true' }}
      working-directory: ./openwrt
      run: |
        make -j$(( $(nproc) + 1 )) || make -j1 V=s
        mv bin/targets/x86/64/*efi.img.gz 2-7505.img.gz
        find bin/targets/x86/64 -mindepth 1 -delete

    - name: Upload 7505 firmware to release
      if: ${{ github.event.inputs.G7505 == 'true' }}
      uses: softprops/action-gh-release@master
      with:
        tag_name: OpenWrt_x86_64_${{ env.FILE_DATE }}
        files: openwrt/2-7505.img.gz

    - name: Restore source code
      if: ${{ github.event.inputs.G7505 == 'true' }}
      working-directory: ./openwrt
      run: |
        patch -p1 -R -f < $GITHUB_WORKSPACE/x86/64/2-7505/simplify-i915-firmware.patch
        patch -p1 -R -f < $GITHUB_WORKSPACE/x86/64/2-7505/simplify-intel-microcode.patch

    - name: Adjust source code for N4505
      if: ${{ github.event.inputs.N4505 == 'true' }}
      working-directory: ./openwrt
      run: |
        patch -p1 -f < $GITHUB_WORKSPACE/x86/64/3-N4505/simplify-intel-microcode.patch

    - name: Load N4505 custom config
      if: ${{ github.event.inputs.N4505 == 'true' }}
      run: |
        rm -rf openwrt/files openwrt/.config
        mv x86/64/3-N4505/files x86/64/3-N4505/.config openwrt/

    - name: Download package
      if: ${{ github.event.inputs.N4505 == 'true' }}
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))

    - name: Compile N4505 firmware
      if: ${{ github.event.inputs.N4505 == 'true' }}
      working-directory: ./openwrt
      run: |
        make -j$(( $(nproc) + 1 )) || make -j1 V=s
        mv bin/targets/x86/64/*efi.img.gz 3-N4505.img.gz
        find bin/targets/x86/64 -mindepth 1 -delete

    - name: Upload N4505 firmware to release
      if: ${{ github.event.inputs.N4505 == 'true' }}
      uses: softprops/action-gh-release@master
      with:
        tag_name: OpenWrt_x86_64_${{ env.FILE_DATE }}
        files: openwrt/3-N4505.img.gz

    - name: Restore source code
      if: ${{ github.event.inputs.N4505 == 'true' }}
      working-directory: ./openwrt
      run: |
        patch -p1 -R -f < $GITHUB_WORKSPACE/x86/64/3-N4505/simplify-intel-microcode.patch

    - name: Adjust source code for 5005U
      if: ${{ github.event.inputs.i3-5005U == 'true' }}
      working-directory: ./openwrt
      run: |
        patch -p1 -f < $GITHUB_WORKSPACE/x86/64/5005U/simplify-intel-microcode.patch

    - name: Load 5005U custom config
      if: ${{ github.event.inputs.i3-5005U == 'true' }}
      run: |
        rm -rf openwrt/files openwrt/.config
        mv x86/64/5005U/files x86/64/5005U/.config openwrt/

    - name: Download package
      if: ${{ github.event.inputs.i3-5005U == 'true' }}
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))

    - name: Compile 5005U firmware
      if: ${{ github.event.inputs.i3-5005U == 'true' }}
      working-directory: ./openwrt
      run: |
        make -j$(( $(nproc) + 1 )) || make -j1 V=s
        mv bin/targets/x86/64/*efi.img.gz 5005U.img.gz
        find bin/targets/x86/64 -mindepth 1 -delete

    - name: Upload 5005U firmware to release
      if: ${{ github.event.inputs.i3-5005U == 'true' }}
      uses: softprops/action-gh-release@master
      with:
        tag_name: OpenWrt_x86_64_${{ env.FILE_DATE }}
        files: openwrt/5005U.img.gz

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags : true
        delete_tag_pattern : x86_64
